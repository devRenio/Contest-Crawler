[project]
name = "contest-crawler"
version = "0.1.0"
description = "국내 대학생 IT+인접 공모전/해커톤 수집기"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "selectolax>=0.3.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.32",
  "python-dotenv>=1.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
contest-crawl = "collector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collector*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
